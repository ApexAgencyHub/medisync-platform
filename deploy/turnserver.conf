# MediSync Global — Hardened coturn TURN/STUN Relay Configuration
# Used for encrypted WebRTC telehealth video calls behind strict mobile/corporate NATs & firewalls.
# Secret (--static-auth-secret), realm (--realm), optional --external-ip, and optional TLS flags
# are injected cleanly via docker-compose.prod.yml.

listening-port=3478
fingerprint
use-auth-secret
pidfile=/var/tmp/turnserver.pid

# Bounded UDP media relay range (open UDP 49152-49252 in host firewall)
min-port=49152
max-port=49252

# Protocol & Relay Hardening
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-cli
stale-nonce=600
max-allocate-lifetime=3600
user-quota=12
total-quota=1200

# Anti-SSRF: block relaying traffic to loopback, RFC1918 private LANs, and cloud metadata IPs
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

simple-log
log-file=stdout
