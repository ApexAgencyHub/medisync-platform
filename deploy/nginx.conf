worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  upstream medisync_web {
    server web:3000;
    keepalive 32;
  }

  upstream medisync_api {
    server api:4000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 52m;

    # Deduplicate upstream headers that Nginx sets centrally (preserve upstream X-Frame-Options: DENY on API vs SAMEORIGIN on Web)
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block internal telemetry/metrics endpoints on public port 80 (keep private inside Docker network)
    location = /metrics {
      return 404;
    }

    location = /v1/metrics {
      return 404;
    }

    # SSE Live Dispatch & Telehealth Streams: highest-priority regex match so proxy buffering is never enabled
    location ~ ^/v1/(dispatch/stream|telehealth/sessions/[^/]+/stream)$ {
      proxy_pass http://medisync_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Public API & liveness/readiness probes
    location ~ ^/(v1/|health$|ready$) {
      proxy_pass http://medisync_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Connection "";
    }

    location / {
      proxy_pass http://medisync_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }
}
