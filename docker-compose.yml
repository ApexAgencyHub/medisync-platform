services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: medisync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medisync
      POSTGRES_USER: medisync
      POSTGRES_PASSWORD: medisync_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - medisync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisync -d medisync"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: medisync-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - medisync_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:latest
    container_name: medisync-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medisync-dev-s3-access-key
      MINIO_ROOT_PASSWORD: medisync-dev-s3-secret-key-min-32-chars
      MINIO_REGION_NAME: us-east-1
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000,http://127.0.0.1:3210,http://localhost:3210"
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - medisync_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  medisync_pgdata:
  medisync_redisdata:
  medisync_miniodata:
