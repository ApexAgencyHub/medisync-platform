name: CI Quality & Security Gate

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: medisync
          POSTGRES_USER: medisync
          POSTGRES_PASSWORD: medisync_dev_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U medisync -d medisync"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://medisync:medisync_dev_password@127.0.0.1:5433/medisync
      AUTH_SECRET: medisync-ci-ephemeral-test-secret-minimum-32-chars

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint & Architectural Boundaries
        run: pnpm lint
      - name: Unit & Integration Tests
        run: pnpm test
      - name: Production Build
        run: pnpm build

  e2e:
    name: Playwright Browser & Responsive Audit
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundles
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Run Playwright Smoke Suite
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
