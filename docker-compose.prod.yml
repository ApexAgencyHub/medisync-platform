# Production reference stack with automatic HTTPS/TLS (Caddy), coturn TURN/STUN for WebRTC telehealth,
# PostgreSQL + PostGIS, Redis, Fastify API, and Next.js Standalone Web.
#
# Quick start:
#   1. node deploy/provision-env.mjs --init --domain app.yourdomain.ma --out .env.production
#   2. node deploy/provision-env.mjs --check --file .env.production
#   3. docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Optional profiles:
#   --profile self-hosted-s3   Include self-hosted MinIO S3 storage with CORS pre-wired to CORS_ORIGINS
#   --profile nginx            Use Nginx (:80) instead of Caddy when terminating TLS upstream (Cloudflare/ALB)

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: medisync
      POSTGRES_USER: ${POSTGRES_USER:-medisync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - medisync_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medisync} -d medisync"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    volumes:
      - medisync_prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6-alpine
    restart: on-failure
    environment:
      TURN_REALM: ${TURN_REALM:-turn.medisync.local}
      TELEHEALTH_TURN_STATIC_AUTH_SECRET: ${TELEHEALTH_TURN_STATIC_AUTH_SECRET:-}
      TELEHEALTH_ICE_SERVERS_JSON: ${TELEHEALTH_ICE_SERVERS_JSON:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_TLS_CERT: ${TURN_TLS_CERT:-}
      TURN_TLS_PKEY: ${TURN_TLS_PKEY:-}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-49252:49152-49252/udp"
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - |
        if [ -z "$$TELEHEALTH_TURN_STATIC_AUTH_SECRET" ]; then
          if [ -n "$$TELEHEALTH_ICE_SERVERS_JSON" ]; then
            echo "External TURN configured via TELEHEALTH_ICE_SERVERS_JSON; skipping local coturn."
            exit 0
          fi
          echo "ERROR: Set TELEHEALTH_TURN_STATIC_AUTH_SECRET or TELEHEALTH_ICE_SERVERS_JSON." >&2
          exit 1
        fi
        set -- -c /etc/coturn/turnserver.conf --realm="$$TURN_REALM" --static-auth-secret="$$TELEHEALTH_TURN_STATIC_AUTH_SECRET"
        if [ -n "$$TURN_EXTERNAL_IP" ]; then
          set -- "$$@" --external-ip="$$TURN_EXTERNAL_IP"
        fi
        if [ -n "$$TURN_TLS_CERT" ] && [ -n "$$TURN_TLS_PKEY" ] && [ -r "$$TURN_TLS_CERT" ] && [ -r "$$TURN_TLS_PKEY" ]; then
          set -- "$$@" --tls-listening-port=5349 --cert="$$TURN_TLS_CERT" --pkey="$$TURN_TLS_PKEY"
        else
          set -- "$$@" --no-tls --no-dtls
        fi
        exec turnserver "$$@"

  minio:
    image: pgsty/minio:latest
    profiles: ["self-hosted-s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY required}
      MINIO_REGION_NAME: ${S3_REGION:-eu-west-1}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:?CORS_ORIGINS required}
    volumes:
      - medisync_prod_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${MEDISYNC_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      TRUST_PROXY: "true"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL required}
        NEXT_PUBLIC_DEFAULT_COUNTRY: ${NEXT_PUBLIC_DEFAULT_COUNTRY:-MA}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_DEFAULT_COUNTRY: ${NEXT_PUBLIC_DEFAULT_COUNTRY:-MA}

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-:80}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:-:9000}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - medisync_prod_caddy_data:/data
      - medisync_prod_caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  medisync_prod_pg:
  medisync_prod_redis:
  medisync_prod_minio:
  medisync_prod_caddy_data:
  medisync_prod_caddy_config:
